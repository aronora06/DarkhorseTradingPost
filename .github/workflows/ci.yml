name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Python
        run: uv python install 3.13

      - name: Sync
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy --strict src

      - name: Tests + package coverage
        run: >
          uv run pytest -ra
          --cov=darkhorse
          --cov-report=term-missing
          --cov-fail-under=88

      - name: Risk coverage gate
        run: >
          uv run pytest -q
          tests/property/test_validate_order_properties.py
          tests/unit/test_drawdown.py
          tests/unit/test_kill_switch.py
          tests/unit/test_sizing.py
          tests/unit/test_validate_order.py
          tests/unit/test_wind_down.py
          --cov=darkhorse.risk
          --cov-report=term-missing
          --cov-fail-under=95
